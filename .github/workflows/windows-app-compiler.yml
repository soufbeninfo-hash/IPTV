name: Build & Release Windows 11 Standalone App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger directly from GitHub UI

jobs:
  build-and-deploy-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-size: 'large'
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compile Product and Proxy Server
        run: |
          npm run build

      - name: Package Windows Portable Executable (.exe)
        run: |
          # Runs electron-builder to generate a standalone binary
          npx electron-builder build --windows --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Standalone Folder as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xtream-IPTV-Flow-Windows11
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 14
